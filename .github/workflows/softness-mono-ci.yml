name: Softness Mono CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Prepare derivative naming
        run: python3 scripts/prepareSoftnessMono.py

      - name: Build fonts
        run: make build

      - name: Verify generated names
        run: |
          . venv/bin/activate
          python3 scripts/verifySoftnessMono.py

      - name: Upload built fonts
        uses: actions/upload-artifact@v4
        with:
          name: softness-mono-fonts
          path: fonts/
